<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring des Services</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Monitoring des Services</h1>
    {% for service, status in statuses.items() %}
    <div class="service">
        <span class="service-name">{{ service }}</span>
        <div class="status {{ 'status-green' if status else 'status-red' }}"></div>
    </div>
    {% endfor %}
</body>
</html>
