name: Build and Push Docker Image

on:
  push:
    branches:
      - monitoring  # Exécutez cette action à chaque push sur la branche `main`
  workflow_dispatch: # Permet de déclencher le workflow manuellement

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Étape 1: Cloner le dépôt
    - name: Checkout code
      uses: actions/checkout@v3

    # Étape 2: Se connecter à Docker Hub ou GHCR
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Étape 3: Construire l'image Docker
    - name: Build Docker image
      run: docker build -t masterIoT/monitoring-app:latest .

    # Étape 4: Pousser l'image vers Docker Hub
    - name: Push Docker image
      run: docker push masterIoT/monitoring-app:latest
